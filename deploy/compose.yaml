name: book-activity
x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE to an approved image tag or digest}
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3001
    APP_ORIGINS: https://${SITE_HOST:?Set SITE_HOST}
    DATABASE_URL: postgresql://book_activity_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-book_activity}
  volumes:
    - admin_data:/app/backend/.local
    - ${VIDEOS_PATH:-/srv/book-activity/videos}:/app/frontend/videos:ro
  security_opt:
    - no-new-privileges:true
  init: true
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-book_activity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *app
    command: [node, scripts/migrate.js]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
  proxy:
    image: caddy:2-alpine
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  admin_data:
  caddy_data:
  caddy_config:
